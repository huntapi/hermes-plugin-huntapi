name: huntapi
version: 1.1.0
description: "Video and audio for Hermes: read the metadata of public videos from YouTube, TikTok, Instagram, Vimeo, X, Reddit and more, and download them as video or audio files, through the HuntAPI media API."
author: HuntAPI
license: MIT
requires_hermes: ">=0.21.6"
provides_tools:
  - huntapi_media_metadata
  - huntapi_video_download
  - huntapi_audio_download
  - huntapi_job_status
  - huntapi_usage
provides_hooks: []
provides_middleware: []
requires_env:
  - name: HUNTAPI_API_KEY
    description: HuntAPI API key
    url: https://app.huntapi.com
    secret: true
config_schema:
  api_key:
    type: secret
    env: HUNTAPI_API_KEY
    label: HuntAPI API key
